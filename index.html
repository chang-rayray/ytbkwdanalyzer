<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 검색 프로그램</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>설정</h2>
            </div>
            <div class="settings-group">
                <label for="api-key-input">YouTube API Key <span class="required">*</span></label>
                <input type="password" id="api-key-input" placeholder="API 키를 입력하세요">
            </div>
            <div class="settings-group">
                <label for="ai-provider">AI 분석 모델 <span class="optional">(선택)</span></label>
                <select id="ai-provider" class="custom-select">
                    <option value="gemini">Gemini (Google)</option>
                    <option value="openai">ChatGPT (OpenAI)</option>
                </select>
            </div>
            <div class="settings-group" id="gemini-key-group">
                <label for="gemini-key-input">Gemini API Key</label>
                <input type="password" id="gemini-key-input" placeholder="Gemini API 키 입력">
            </div>
            <div class="settings-group" id="openai-key-group" style="display: none;">
                <label for="openai-key-input">OpenAI API Key</label>
                <input type="password" id="openai-key-input" placeholder="sk-... 로 시작하는 키 입력">
            </div>
            <button id="save-api-key-btn" class="primary-btn">설정 저장</button>
            <div id="api-key-status" class="status-message"></div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <header class="main-header">
                <h1>유튜브 키워드 분석기</h1>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="분석할 키워드를 입력하세요 (예: 아이폰 리뷰)">
                    <button id="search-btn" class="primary-btn">분석</button>
                </div>
            </header>

            <div class="actions-bar">
                <div id="search-status" class="status-text"></div>
                <button id="download-csv-btn" class="secondary-btn" disabled>CSV 다운로드</button>
            </div>

            <!-- 분석 대시보드 -->
            <div id="dashboard-container" class="dashboard-container" style="display: none;">
                <div class="dashboard-card">
                    <div class="card-icon">📈</div>
                    <div class="card-content">
                        <h3>검색량 추정</h3>
                        <p id="estimated-volume">-</p>
                    </div>
                </div>
                <div class="dashboard-card">
                    <div class="card-icon">⚔️</div>
                    <div class="card-content">
                        <h3>경쟁 강도</h3>
                        <p id="competition-intensity">-</p>
                    </div>
                </div>
                <div class="dashboard-card">
                    <div class="card-icon">🏷️</div>
                    <div class="card-content">
                        <h3>추천 태그</h3>
                        <div id="recommended-tags" class="tags-container">-</div>
                    </div>
                </div>
            </div>

            <!-- AI 전략 분석 -->
            <div id="ai-analysis-container" class="ai-analysis-container" style="display: none;">
                <div class="ai-header">
                    <h3>✨ AI 전략 분석</h3>
                    <span id="ai-badge" class="ai-badge">Gemini</span>
                </div>
                <div id="ai-content" class="ai-content">
                    <div class="ai-loader" style="display: none;">AI가 키워드 전략을 분석하고 있습니다...</div>
                    <div id="ai-text" class="ai-text"></div>
                </div>
            </div>

            <!-- 테이블 컨테이너 -->
            <div class="table-container">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>영상</th>
                            <th>제목</th>
                            <th>채널명</th>
                            <th>설명</th>
                            <th>태그</th>
                            <th class="number-col">조회수</th>
                            <th class="number-col">좋아요수</th>
                            <th class="number-col">구독자수</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody">
                        <tr>
                            <td colspan="8" class="empty-state">검색어를 입력하고 검색 버튼을 눌러주세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
